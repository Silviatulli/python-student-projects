<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">&gt;&gt;&gt;</span> {{ site.title }}</a>
      <nav>
        <a href="{{ '/basic/' | relative_url }}"{% if page.url contains '/basic/' %} class="active"{% endif %}>Basic Python</a>
        <a href="{{ '/advanced/' | relative_url }}"{% if page.url contains '/advanced/' %} class="active"{% endif %}>Advanced Python</a>
        <a href="{{ '/submit/' | relative_url }}"{% if page.url contains '/submit/' %} class="active"{% endif %}>Submit</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Student projects from the Basic &amp; Advanced Python courses. Each post is the work of its authors.</p>
    </div>
  </footer>
</body>
</html>
